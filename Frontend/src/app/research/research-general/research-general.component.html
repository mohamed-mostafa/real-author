<div class="card card-developer-meetup">
  <div class="bg-light-primary rounded-top text-center">
    <img
      src="{{
        data.image ? data.image : 'assets/images/illustration/email.svg'
      }}"
      alt="Meeting Pic"
      height="170"
    />
  </div>
  <div class="card-body">
    <div class="meetup-header d-flex align-items-center">
      <div class="meetup-day">
        <h3 class="mb-0">
          {{ data.created_at | date }}
        </h3>
      </div>
      <div class="my-auto">
        <h4 class="card-title mb-25">
          {{ data.name }}
        </h4>
        <p class="card-text mb-0">{{ data.status }}</p>
      </div>
    </div>
    <div class="media">
      <div class="media-body">
        <h6 class="mb-0">
          {{ data.abstract ? data.abstract : "No Abstract Found" }}
        </h6>
      </div>
      <!-- <div class="FloatRight">
        <button
          (click)="participateInResearch()"
          class="btn btn-primary mr-1 waves-effect waves-float waves-light"
        >
          Participate
        </button>
      </div> -->
    </div>

    <div class="avatar-group">
      <ng-container
        *ngIf="
          data.investigators && data.investigators.length > 0;
          else elseTemplate
        "
      >
        <div
          *ngFor="let invest of data.investigators"
          placement="bottom"
          container="body"
          ngbTooltip="Investigators"
          class="avatar pull-up"
        >
          <img
            src="assets/images/portrait/small/default.jpg"
            alt="Avatar"
            width="33"
            height="33"
          />
        </div>
      </ng-container>
      <ng-template #elseTemplate> No Investigators Found </ng-template>
    </div>
  </div>
</div>
